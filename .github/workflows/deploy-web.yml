name: Deploy ZenFlow Web

on:
  push:
    branches:
      - web-demo
    paths:
      - "ZenFlow/ZenFlow.Web/**"
      - ".github/workflows/deploy-web.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ZenFlow

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar proyecto web
        run: dotnet restore ./ZenFlow.Web/ZenFlow.Web.csproj

      - name: Publicar aplicación Blazor
        run: >
          dotnet publish
          ./ZenFlow.Web/ZenFlow.Web.csproj
          --configuration Release
          --no-restore
          --output ./publish

      - name: Configurar ruta de GitHub Pages
        shell: bash
        run: |
          sed -i 's|<base href="/" />|<base href="/ZenFLow/" />|' \
          ./publish/wwwroot/index.html

      - name: Preparar navegación de Blazor
        shell: bash
        run: |
          cp ./publish/wwwroot/index.html \
             ./publish/wwwroot/404.html

      - name: Desactivar Jekyll
        shell: bash
        run: touch ./publish/wwwroot/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ZenFlow/publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
